name: Deploy to Server

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy fixed main SHA to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            cd /root/kiralama_projesi_v4

            APP_SERVICE="kiralama_v4.service"
            SCHEDULER_SERVICE="kiralama_scheduler.service"
            EXPECTED_DB_HEAD="c3d4e5f6a7b8"
            RELEASE_SHA="${{ github.sha }}"

            echo ">>> Kod degismeden once canli DB revision kontrolu"
            test -f .env
            set -a
            source .env
            set +a
            export FLASK_APP=run.py
            test -n "${DATABASE_URL:-}"

            CURRENT_OUTPUT=$(venv/bin/python -m flask db current)
            echo "$CURRENT_OUTPUT"
            echo "$CURRENT_OUTPUT" | grep -q "$EXPECTED_DB_HEAD"

            echo ">>> Calisma agaci ve servis kontrolleri"
            git diff --quiet
            git diff --cached --quiet
            systemctl is-active --quiet "$APP_SERVICE"
            systemctl is-active --quiet "$SCHEDULER_SERVICE"

            echo ">>> Sabit release SHA indiriliyor"
            git fetch --no-tags origin "$RELEASE_SHA"
            git cat-file -e "$RELEASE_SHA^{commit}"

            MIGRATION_BACKUP="/tmp/kiralama_pre_deploy_$(date +%Y%m%d_%H%M%S).dump"
            echo ">>> Deploy oncesi DB yedegi: $MIGRATION_BACKUP"
            pg_dump "$DATABASE_URL" --format=custom --file="$MIGRATION_BACKUP"
            sha256sum "$MIGRATION_BACKUP" > "$MIGRATION_BACKUP.sha256"

            echo ">>> Uygulama ve scheduler durduruluyor"
            systemctl stop "$SCHEDULER_SERVICE"
            systemctl stop "$APP_SERVICE"

            echo ">>> Sabit SHA kuruluyor: $RELEASE_SHA"
            git checkout --detach "$RELEASE_SHA"
            venv/bin/pip install -r requirements.txt
            venv/bin/python -c "from app import create_app; create_app()"

            echo ">>> Beklenen migration head kontrolu"
            HEADS_OUTPUT=$(venv/bin/python -m flask db heads)
            echo "$HEADS_OUTPUT"
            test "$(printf '%s\n' "$HEADS_OUTPUT" | grep -c '(head)')" -eq 1
            echo "$HEADS_OUTPUT" | grep -q "$EXPECTED_DB_HEAD"

            venv/bin/python -m flask db upgrade "$EXPECTED_DB_HEAD"

            CURRENT_OUTPUT=$(venv/bin/python -m flask db current)
            echo "$CURRENT_OUTPUT"
            echo "$CURRENT_OUTPUT" | grep -q "$EXPECTED_DB_HEAD"

            echo ">>> Servisler baslatiliyor"
            systemctl start "$APP_SERVICE"
            systemctl start "$SCHEDULER_SERVICE"
            systemctl is-active --quiet "$APP_SERVICE"
            systemctl is-active --quiet "$SCHEDULER_SERVICE"

            echo ">>> Deploy tamamlandi: $RELEASE_SHA"
